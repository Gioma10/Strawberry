<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Linked here (not imported in main.ts) so styles apply before first paint -->
    <link rel="stylesheet" href="/src/style.css" />
    <title>strawberry</title>
  </head>
  <body class="h-svh overflow-hidden bg-cream">
<span id="project" class="pointer-events-none fixed top-6 left-6 z-20 select-none text-xs font-black tracking-widest text-forest uppercase">#1 Project</span>

    <!-- Loader -->
    <div
      id="loader"
      class="fixed inset-0 z-30 grid place-items-center bg-cream"
    >
      <div class="w-48">
        <div class="h-1 w-full overflow-hidden rounded-md bg-sage/30">
          <div id="loader-bar" class="h-full w-0 bg-forest"></div>
        </div>
        <p
          id="loader-text"
          class="mt-2 text-center text-sm font-bold text-forest"
        >
          0%
        </p>
      </div>
    </div>

    <!-- 3D layer: full-screen background, receives the mouse for OrbitControls -->
    <canvas class="webgl fixed inset-0 z-10 outline-none"></canvas>

    <!-- UI layer: 3 rows, the middle one is exactly centered like the strawberry.
         41svh = strawberry height on screen (2.5 units, camera at z=4, fov 75).
         pointer-events-none lets drags reach the canvas; the button turns them back on. -->
    <main
      class="pointer-events-none relative z-20 grid h-svh grid-rows-[1fr_41svh_1fr] justify-items-center"
    >
      <h1
        class="self-end pb-2 select-none whitespace-nowrap text-[min(13vw,16svh)] leading-none font-black tracking-tighter text-forest uppercase"
      >
        Strawberry
      </h1>

      <!-- Empty slot where the strawberry shows through -->
      <div aria-hidden="true"></div>

      <!-- Description and change button -->
      <div class="flex flex-col justify-start items-center">

        <!-- overflow-hidden clips the description while it slides, like the title slot -->
        <div id="description-slot" class="overflow-hidden">
        <p
        id="section-description"
        class="max-w-lg text-center text-sm text-balance text-forest/80 select-none"
        >
        Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor.
      </p>
        </div>
      <button
      id="change"
      class="mt-6 pointer-events-auto cursor-pointer rounded-full bg-forest px-10 py-3 text-sm font-black tracking-widest text-cream uppercase transition-colors duration-300 hover:bg-sage hover:text-forest focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-forest"
      >
      Change
    </button>
  </div>
    </main>

    <!-- Details view (after Change): the row [prev] TITLE [next], centered in the free band
         above the strawberry (23svh, same as the Use band below). Starts invisible;
         the change animation shows it. pointer-events-none lets drags reach the canvas. -->
    <section
      id="details"
      class="invisible pointer-events-none fixed inset-x-0 top-0 z-20 flex h-[23svh] items-center justify-center"
    >
    
    <div class="flex items-center gap-4">
      <button
      id="prev"
      aria-label="Previous"
      class="pointer-events-auto grid size-12 cursor-pointer place-items-center rounded-full  text-forest transition-colors duration-300 hover:bg-forest hover:text-cream focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-forest"
      >
      <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="size-6"
      aria-hidden="true"
      >
      <path d="m15 18-6-6 6-6" />
    </svg>
  </button>
  
  <!-- Title slot. overflow-hidden clips the title while it slides in/out.
  The invisible "Strawberry" (longest section name) sits in the same grid cell and
  fixes the width, so the arrows don't move when the title changes.
  Update it if you add a longer section name. -->
  <div
  class="grid overflow-hidden select-none text-[min(8vw,7svh)] leading-none font-black tracking-tighter text-forest uppercase"
  >
  <span aria-hidden="true" class="invisible col-start-1 row-start-1">Strawberry</span>
  <h2 id="section-title" class="col-start-1 row-start-1 text-center">Complete</h2>
</div>

<button
id="next"
aria-label="Next"
class="pointer-events-auto grid size-12 cursor-pointer place-items-center rounded-full text-forest transition-colors duration-300 hover:bg-forest hover:text-cream focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-forest"
>
<svg
xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2.5"
stroke-linecap="round"
stroke-linejoin="round"
class="size-6"
aria-hidden="true"
>
<path d="m9 18 6-6-6-6" />
</svg>
</button>
</div>

<!-- Use button in the free space below the strawberry.
     23svh = (100 - 54) / 2: in details the camera is at z=3, so the strawberry is ~54svh tall. -->
<div class="fixed inset-x-0 bottom-0 flex h-[23svh] items-center justify-center">
  <button
    id="use"
    class="pointer-events-auto cursor-pointer rounded-full bg-forest px-10 py-3 text-sm font-black tracking-widest text-cream uppercase transition-colors duration-300 hover:bg-sage hover:text-forest focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-forest"
  >
    Use
  </button>
</div>
</section>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
