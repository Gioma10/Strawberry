<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Linked here (not imported in main.ts) so styles apply before first paint -->
    <link rel="stylesheet" href="/src/style.css" />
    <title>strawberry</title>
  </head>
  <body class="h-svh overflow-hidden bg-green-200">
    <!-- Loader -->
    <div
      id="loader"
      class="fixed inset-0 z-30 grid place-items-center bg-green-200"
    >
      <div class="w-48">
        <div class="h-1 w-full overflow-hidden rounded-md bg-white">
          <div id="loader-bar" class="h-full w-0 bg-red-800"></div>
        </div>
        <p
          id="loader-text"
          class="mt-2 text-center text-sm font-bold text-white"
        >
          0%
        </p>
      </div>
    </div>

    <!-- 3D layer: full-screen background, receives the mouse for OrbitControls -->
    <canvas class="webgl fixed inset-0 z-10 outline-none"></canvas>

    <!-- UI layer: 3 rows, the middle one is exactly centered like the strawberry.
         41svh = strawberry height on screen (2.5 units, camera at z=4, fov 75).
         pointer-events-none lets drags reach the canvas; the button turns them back on. -->
    <main
      class="pointer-events-none relative z-20 grid h-svh grid-rows-[1fr_41svh_1fr] justify-items-center"
    >
      <h1
        class="self-end pb-2 select-none whitespace-nowrap text-[min(13vw,16svh)] leading-none font-black tracking-tighter text-white uppercase"
      >
        Strawberry
      </h1>

      <!-- Empty slot where the strawberry shows through -->
      <div aria-hidden="true"></div>

      <button
        id="enter"
        class="mt-6 self-start pointer-events-auto cursor-pointer rounded-full bg-white px-10 py-3 text-sm font-black tracking-widest text-red-800 uppercase transition-colors duration-300 hover:bg-red-800 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-white"
      >
        Enter
      </button>
    </main>

    <!-- Details view (after Enter): home centered on top, then the row [prev] TITLE [next].
         Starts invisible; the enter animation shows it. -->
    <section
      id="details"
      class="invisible pointer-events-none fixed inset-x-0 top-0 z-20 flex flex-col items-center gap-3 p-6"
    >
        <button
          id="home"
          aria-label="Home"
          class="pointer-events-auto grid size-12 cursor-pointer place-items-center rounded-full bg-white text-red-800 transition-colors duration-300 hover:bg-red-800 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-white"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-5"
            aria-hidden="true"
          >
            <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
            <path
              d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
            />
          </svg>
        </button>

        <div class="flex items-center gap-4">
        <button
          id="prev"
          aria-label="Previous"
          class="pointer-events-auto grid size-12 cursor-pointer place-items-center rounded-full  text-red-800 transition-colors duration-300 hover:bg-red-800 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-white"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-6"
            aria-hidden="true"
          >
            <path d="m15 18-6-6 6-6" />
          </svg>
        </button>

        <!-- Title slot. overflow-hidden clips the title while it slides in/out.
             The invisible "Strawberry" (longest section name) sits in the same grid cell and
             fixes the width, so the arrows don't move when the title changes.
             Update it if you add a longer section name. -->
        <div
          class="grid overflow-hidden select-none text-[min(8vw,7svh)] leading-none font-black tracking-tighter text-white uppercase"
        >
          <span aria-hidden="true" class="invisible col-start-1 row-start-1">Strawberry</span>
          <h2 id="section-title" class="col-start-1 row-start-1 text-center">Complete</h2>
        </div>

        <button
          id="next"
          aria-label="Next"
          class="pointer-events-auto grid size-12 cursor-pointer place-items-center rounded-full text-red-800 transition-colors duration-300 hover:bg-red-800 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-white"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-6"
            aria-hidden="true"
          >
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
        </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
